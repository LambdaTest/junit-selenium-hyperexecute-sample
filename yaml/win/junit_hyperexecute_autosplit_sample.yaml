---
version: 0.2
runson: win

runtime:
  language: java
  version: 17

autosplit: true
concurrency: 3

env:
  CACHE_DIR: m2_cache_dir
  TARGET_OS: win

cacheKey: '{{ checksum "pom.xml" }}'
cacheDirectories:
  - ${CACHE_DIR}

pre:
  - mvn -Dmaven.repo.local=${CACHE_DIR} -DskipTests clean install

mergeArtifacts: true

framework:
  name: maven/junit5
  defaultReports: false
  flags:
    - "-Dplatname=win"
    - "-Dmaven.repo.local=m2_cache_dir"
  discoveryType: method
  discoveryMode: remote

retryOnFailure: true
maxRetries: 1

jobLabel: [selenium-junit, win, autosplit]
